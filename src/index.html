    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",system-ui,-apple-system,sans-serif;}
        body{
            min-height:100vh;
            background:linear-gradient(135deg,#1a1a2e 0%,#16213e 35%,#0f3460 100%);
            display:flex;align-items:flex-start;justify-content:center;
            padding:0;overflow-y:auto;
        }
        body::before,body::after{
            content:'';position:fixed;border-radius:50%;pointer-events:none;
            filter:blur(80px);opacity:0.35;z-index:0;
        }
        body::before{
            width:600px;height:600px;
            background:radial-gradient(circle,#4A70FF 0%,transparent 70%);
            top:-120px;left:-100px;animation:orbFloat1 18s ease-in-out infinite;
        }
        body::after{
            width:500px;height:500px;
            background:radial-gradient(circle,#9263FF 0%,transparent 70%);
            bottom:-80px;right:-60px;animation:orbFloat2 22s ease-in-out infinite;
        }
        @keyframes orbFloat1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,60px)}}
        @keyframes orbFloat2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-80px)}}
        .main-wrap{
            position:relative;z-index:1;width:100%;max-width:960px;
            padding:60px 40px 40px;min-height:100vh;
            display:flex;flex-direction:column;align-items:center;
        }
        .logo-area{text-align:center;margin-bottom:36px;}
        .logo-area h1{
            font-size:36px;font-weight:700;letter-spacing:2px;
            background:linear-gradient(135deg,#fff 0%,#c8d6ff 100%);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
        }
        .logo-area .sub-title{color:rgba(200,210,255,0.7);font-size:15px;margin-top:8px;letter-spacing:1px;}
        .tab-wrap{
            display:inline-flex;gap:0;background:rgba(255,255,255,0.08);
            border-radius:28px;padding:4px;margin-bottom:32px;
            border:1px solid rgba(255,255,255,0.1);
        }
        .tab-btn{
            padding:10px 36px;border:none;border-radius:24px;
            background:transparent;color:rgba(255,255,255,0.65);
            font-size:15px;font-weight:500;cursor:pointer;transition:all 0.35s;
        }
        .tab-btn.active{
            background:linear-gradient(135deg,#4A70FF 0%,#9263FF 100%);
            color:#fff;font-weight:600;box-shadow:0 4px 16px rgba(74,112,255,0.35);
        }
        .tab-btn:hover:not(.active){background:rgba(255,255,255,0.12);color:#fff;}
        .panel{display:none;width:100%;}.panel.active{display:block;}
        .search-bar{
            display:flex;align-items:center;width:100%;max-width:680px;margin:0 auto 24px;
            background:#fff;border-radius:28px;border:2px solid transparent;
            background-clip:padding-box;position:relative;
            box-shadow:0 4px 24px rgba(0,0,0,0.15);transition:all 0.3s;
        }
        .search-bar::before{
            content:'';position:absolute;inset:-2px;border-radius:30px;
            background:linear-gradient(135deg,#4A70FF 0%,#9263FF 100%);
            z-index:-1;opacity:0.7;transition:opacity 0.3s;
        }
        .search-bar:focus-within::before{opacity:1;}
        #phoneInput{
            flex:1;height:52px;padding:0 24px;border:none;outline:none;
            border-radius:28px 0 0 28px;background:transparent;color:#333;font-size:16px;
        }
        #phoneInput::placeholder{color:#aaa;font-size:15px;}
        .check-btn{
            height:52px;padding:0 32px;border:none;border-radius:0 28px 28px 0;
            background:linear-gradient(135deg,#4A70FF 0%,#9263FF 100%);
            color:#fff;font-size:16px;font-weight:600;cursor:pointer;
            transition:all 0.3s;white-space:nowrap;letter-spacing:1px;
        }
        .check-btn:hover{filter:brightness(1.12);}
        .result-box{
            min-height:80px;line-height:80px;text-align:center;
            font-size:16px;border-radius:16px;padding:0 24px;
            transition:all 0.3s;width:100%;max-width:680px;margin:0 auto;
        }
        .warn{
            background:rgba(255,70,70,0.12);border:1px solid rgba(255,100,100,0.3);
            color:#ff8a8a;line-height:1.9;padding:24px 20px;font-size:16px;
            backdrop-filter:blur(8px);
        }
        .pass{
            background:rgba(40,210,120,0.12);border:1px solid rgba(80,220,150,0.3);
            color:#7bebb5;backdrop-filter:blur(8px);
        }
        .actual-user{color:#ffd166;font-weight:600;}
        .batch-area{width:100%;max-width:860px;margin:0 auto;}
        #batchInput{
            width:100%;height:160px;padding:18px 22px;
            border:2px solid rgba(255,255,255,0.15);border-radius:16px;
            background:rgba(255,255,255,0.06);color:#eee;font-size:15px;line-height:1.65;
            outline:none;resize:vertical;transition:all 0.3s;
            font-family:"Microsoft YaHei",system-ui,sans-serif;
        }
        #batchInput::placeholder{color:rgba(255,255,255,0.35);}
        #batchInput:focus{
            border-color:rgba(74,112,255,0.5);background:rgba(255,255,255,0.1);
            box-shadow:0 0 0 3px rgba(74,112,255,0.12);
        }
        .batch-hint{color:rgba(255,255,255,0.4);font-size:13px;margin:8px 0 16px 4px;}
        .batch-btn-wrap{display:flex;gap:12px;margin-bottom:4px;}
        .batch-btn{
            flex:1;height:50px;border:none;border-radius:14px;
            background:linear-gradient(135deg,#4A70FF 0%,#9263FF 100%);
            color:#fff;font-size:16px;font-weight:600;cursor:pointer;
            transition:all 0.3s;letter-spacing:1px;
        }
        .batch-btn:hover{filter:brightness(1.12);transform:translateY(-1px);}
        .clear-btn{
            width:100px;height:50px;border:none;border-radius:14px;
            background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);
            font-size:15px;cursor:pointer;transition:all 0.3s;
            border:1px solid rgba(255,255,255,0.15);
        }
        .clear-btn:hover{background:rgba(255,255,255,0.18);color:#fff;}
        .batch-stats{display:flex;gap:10px;margin:20px 0 14px;flex-wrap:wrap;}
        .stat-chip{padding:7px 18px;border-radius:20px;font-size:13px;font-weight:500;color:rgba(255,255,255,0.9);}
        .stat-total{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.15);}
        .stat-inner{background:rgba(255,70,70,0.25);border:1px solid rgba(255,100,100,0.3);}
        .stat-outer{background:rgba(40,210,120,0.25);border:1px solid rgba(80,220,150,0.3);}
        .stat-invalid{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);}
        .batch-result{
            border-radius:16px;overflow:hidden;
            border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);
            backdrop-filter:blur(6px);
        }
        .result-table{width:100%;border-collapse:collapse;font-size:14px;}
        .result-table th{
            background:rgba(74,112,255,0.15);color:rgba(255,255,255,0.85);
            padding:12px 14px;text-align:left;font-weight:600;font-size:13px;
            border-bottom:1px solid rgba(255,255,255,0.1);white-space:nowrap;letter-spacing:0.5px;
        }
        .result-table td{
            padding:11px 14px;color:rgba(255,255,255,0.85);
            border-bottom:1px solid rgba(255,255,255,0.06);word-break:break-all;
        }
        .result-table tbody tr{transition:background 0.2s;}
        .result-table tbody tr:hover td{background:rgba(255,255,255,0.06);}
        .result-table tbody tr:last-child td{border-bottom:none;}
        .tag-inner,.tag-outer,.tag-invalid{
            display:inline-block;padding:3px 12px;border-radius:10px;
            font-size:12px;font-weight:500;white-space:nowrap;
        }
        .tag-inner{background:rgba(255,70,70,0.2);color:#ff8a8a;border:1px solid rgba(255,100,100,0.25);}
        .tag-outer{background:rgba(40,210,120,0.2);color:#7bebb5;border:1px solid rgba(80,220,150,0.25);}
        .tag-invalid{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.15);}
        .remark-text{color:#ffd166;font-size:13px;font-weight:500;}
        .footer-tips{margin-top:32px;text-align:center;padding-bottom:20px;}
        .tip-text{color:rgba(255,255,255,0.4);font-size:13px;}
        .secret-tip{color:rgba(255,150,150,0.5);font-size:12px;margin-top:8px;}
        @media(max-width:640px){
            .main-wrap{padding:30px 16px 20px;}
            .logo-area h1{font-size:26px;}
            .search-bar{max-width:100%;}
            #phoneInput{padding:0 16px;font-size:15px;}
            .check-btn{padding:0 20px;font-size:15px;}
            .batch-area{max-width:100%;}
            .tab-btn{padding:8px 24px;font-size:14px;}
        }
    </style>
</head>
<body>
    <div class="main-wrap">
        <div class="logo-area">
            <h1>CRM 内部号码校验工具</h1>
            <div class="sub-title" id="subTitle"></div>
        </div>
        <div class="tab-wrap">
            <button class="tab-btn active" data-tab="single" id="tabSingle">单个校验</button>
            <button class="tab-btn" data-tab="batch" id="tabBatch">批量校验</button>
        </div>
        <div class="panel active" id="panelSingle">
            <div class="search-bar">
                <input type="text" id="phoneInput" placeholder="请输入11位手机号码">
                <button class="check-btn" id="checkBtn">立即校验</button>
            </div>
            <div id="resultBox" class="result-box"></div>
        </div>
        <div class="panel" id="panelBatch">
            <div class="batch-area">
                <textarea id="batchInput" placeholder="粘贴多个手机号码，每行一个或用空格/逗号分隔
例：
13800001111
13900002222, 15000003333
18600004444 17700005555"></textarea>
                <div class="batch-hint">支持换行、空格、逗号分隔，也可直接从Excel复制粘贴</div>
                <div class="batch-btn-wrap">
                    <button class="batch-btn" id="batchBtn">批量校验</button>
                    <button class="clear-btn" id="clearBtn">清空</button>
                </div>
                <div id="batchResult"></div>
            </div>
        </div>
        <div class="footer-tips">
            <div class="tip-text">温馨提示：内部员工号码禁止CRM业务受理，外部号码可正常办理</div>
            <div class="secret-tip">严禁查询工具外泄，仅限内部使用</div>
        </div>
    </div>
    <script>
    (function(){
        document.addEventListener('contextmenu',function(e){e.preventDefault()});
        document.addEventListener('keydown',function(e){
            if(e.keyCode===123||(e.ctrlKey&&e.shiftKey&&e.keyCode===73)||(e.ctrlKey&&e.keyCode===85)){e.preventDefault();return false;}
        });
        var _0dt=new Date();
        (function(){}).constructor('debugger')();
